upstream backend {
    server backend:8000;
    keepalive 32;
}

# Behind Cloudflare every connection arrives from their network, so $remote_addr
# is a Cloudflare address and the visitor's own is in CF-Connecting-IP. Trusting
# that header is only safe for these ranges: from anywhere else a client could
# forge it and walk past every rate limit. The same list belongs in the server
# firewall, so nothing can reach the origin bypassing Cloudflare.
# Source: https://www.cloudflare.com/ips-v4 and /ips-v6 (changes about yearly).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Adds the visitor's country (Cloudflare sends it) and how long the response
# took, which is what turns the access log into something worth reading.
log_format codegard '$remote_addr "$http_cf_ipcountry" [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
access_log /var/log/nginx/access.log codegard;

gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 1000;

server {
    listen 80;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Explicitly off, not absent: the built-in filter it switches on was removed
    # from modern browsers for causing holes of its own, but an old one would
    # turn it on by default. Real protection is a content policy, still to come.
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # The judge and Flower are deliberately not proxied: both stay on the
    # private network. The judge is reached only through Redis, and Flower is
    # an admin panel that can stop tasks, so it goes over an SSH tunnel.

    # Django's own files (the admin). Filenames are not hashed, so a day keeps
    # a Django upgrade from leaving stale styles in anyone's browser for long.
    # nosniff is repeated because any add_header here drops the inherited ones.
    location /static/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # App shell must revalidate so deploys are picked up. Uses expires rather
    # than add_header on purpose: one add_header here would drop every header
    # inherited from the server block, and they used to be copied out by hand.
    location = /index.html {
        expires -1;
    }

    # SPA routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}

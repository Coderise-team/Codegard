upstream backend {
    server backend:8000;
    keepalive 32;
}

gzip on;
gzip_types application/json application/javascript text/css text/plain;
gzip_min_length 1000;

server {
    listen 80;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # The judge and Flower are deliberately not proxied: both stay on the
    # private network. The judge is reached only through Redis, and Flower is
    # an admin panel that can stop tasks, so it goes over an SSH tunnel.

    # Django's own files (the admin). Filenames are not hashed, so a day keeps
    # a Django upgrade from leaving stale styles in anyone's browser for long.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # App shell must revalidate so deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # SPA routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }
}

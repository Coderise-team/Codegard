name: codegard-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: python django_app/manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/django_app:/app/django_app
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codegard_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir django_app
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
    volumes:
      - ./backend/django_app:/app/django_app
      - ./shared:/shared
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./backend/django_app
          target: /app/django_app
        - action: sync
          path: ./shared
          target: /shared
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
    volumes:
      - ./backend/django_app:/app/django_app
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: ./backend/django_app
          target: /app/django_app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  judge-results-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: python django_app/manage.py consume_judge_results
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend/django_app:/app/django_app
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - codegard_net
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/consumer_heartbeat 2>/dev/null || echo 0) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    develop:
      watch:
        - action: sync
          path: ./backend/django_app
          target: /app/django_app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
    volumes:
      - ./backend/django_app:/app/django_app
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./backend/django_app
          target: /app/django_app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    command: run-tests
    profiles:
      - test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PYTHONPATH: /app/django_app:/shared
      DJANGO_SETTINGS_MODULE: settings.test
      # Blank out R2 so the suite runs the same on every machine: storages.py
      # reads these at import time and would otherwise follow each developer's
      # own .env.
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
    volumes:
      - ./backend:/app
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codegard_net

  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
      target: web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      PYTHONPATH: /shared
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./judge
          target: /app
        - action: sync
          path: ./shared
          target: /shared
        - action: rebuild
          path: ./judge/pyproject.toml
        - action: rebuild
          path: ./judge/uv.lock

  judge-test:
    build:
      context: .
      dockerfile: judge/Dockerfile
      target: test
    command: run-tests
    profiles:
      - test
    environment:
      PYTHONPATH: /shared
    volumes:
      - ./shared:/shared
    networks:
      - codegard_net

  databasus:
    image: databasus/databasus:latest
    container_name: databasus
    ports:
      - "4005:4005"
    volumes:
      - ./data/databasus-data:/databasus-data
    networks:
      - codegard_net
    depends_on:
      postgres:
        condition: service_healthy

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    command: sh -c "celery -A config flower --port=5555 --basic_auth=$${FLOWER_USER}:$${FLOWER_PASSWORD}"
    environment:
      DJANGO_SETTINGS_MODULE: settings.dev
      PYTHONPATH: /app/django_app:/shared
    volumes:
      - ./shared:/shared
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - codegard_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5555), timeout=2).close()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # keep the container's linux node_modules
    depends_on:
      - backend
    networks:
      - codegard_net

  frontend-test:
    build:
      context: ./frontend
      target: test
    command: run-tests
    profiles:
      - test
    env_file: .env
    networks:
      - codegard_net

networks:
  codegard_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

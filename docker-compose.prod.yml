name: codegard-prod

# Docker keeps container output forever by default, so on a long-running server
# the logs quietly eat the disk. Capped at three 50 MB files per service, which
# is weeks of history at our volume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # oom_score_adj tilts the kernel's choice when memory runs out: it kills the
    # highest number first. Every service sets one, so they form a single scale.
    # Last thing on the machine we let die.
    oom_score_adj: -900
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Holds the live judge queue.
    oom_score_adj: -800
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: web
    command: gunicorn -k uvicorn.workers.UvicornWorker config.asgi:application --bind 0.0.0.0:8000 --workers 4
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      # Unbuffered: Python holds piped output back otherwise, so a crash takes
      # the last (most interesting) lines with it.
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Losing it takes the whole site down.
    oom_score_adj: -500
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs once per deploy and exits: gathers the admin's CSS and JS into the
  # volume nginx serves. Without it the admin loads unstyled, since the request
  # falls through to the SPA and comes back as HTML.
  collectstatic:
    build:
      context: ./backend
      target: web
    # Skips the image's entrypoint (migrations); collecting files needs no DB.
    entrypoint: []
    command: python django_app/manage.py collectstatic --noinput
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
      - static_files:/app/django_app/staticfiles
    env_file: .env
    # Runs for seconds and exits anyway.
    oom_score_adj: 500
    logging: *logging
    networks:
      - codegard_net

  celery-worker:
    build:
      context: ./backend
      target: web
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # A killed task is redelivered on the next round.
    oom_score_adj: 100
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  judge-results-consumer:
    build:
      context: ./backend
      target: web
    command: python django_app/manage.py consume_judge_results
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Verdicts wait in Redis until it is back.
    oom_score_adj: 0
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/consumer_heartbeat 2>/dev/null || echo 0) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: ./backend
      target: web
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Just an alarm clock; it catches up after a restart.
    oom_score_adj: 200
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  flower:
    build:
      context: ./backend
      target: web
    # No url_prefix: nginx no longer proxies Flower, and the prefix would 404
    # the tunnelled root. Basic auth stays as a second lock behind the tunnel.
    command: sh -c "celery -A config flower --port=5555 --basic_auth=$${FLOWER_USER}:$${FLOWER_PASSWORD}"
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./shared:/shared
    env_file: .env
    # Bound to the server's own loopback, so the panel is reachable only from
    # the machine itself — that is, through an SSH tunnel, never from outside.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    # First to go: nobody notices a missing dashboard.
    oom_score_adj: 500
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5555), timeout=2).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  judge:
    build:
      context: ./judge
      target: web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
    environment:
      PYTHONPATH: /shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    volumes:
      - ./shared:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    # Submissions keep piling up in the queue while it is gone.
    oom_score_adj: -100
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./frontend
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/static:ro
      # Certificates live on the server only — see infra/DEPLOY.md.
      # - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      collectstatic:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    # The only door in.
    oom_score_adj: -400
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped

networks:
  codegard_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_files:

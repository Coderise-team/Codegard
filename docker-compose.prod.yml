name: codegard-prod

# Docker keeps container output forever by default, so on a long-running server
# the logs quietly eat the disk. Capped at three 50 MB files per service, which
# is weeks of history at our volume.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # oom_score_adj tilts the kernel's choice when memory runs out: it kills the
    # highest number first. Every service sets one, so they form a single scale.
    # Last thing on the machine we let die.
    oom_score_adj: -900
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # noeviction on purpose: the judge queue lives here, and the alternative is
    # Redis quietly dropping other people's submissions to make room. Full means
    # writes are refused and the submit page says so, which is recoverable.
    # The journal costs one second of writes on a crash instead of minutes.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAXMEMORY:?REDIS_MAXMEMORY is required}
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    # Read by redis-cli on its own, so the health check below does not have to
    # carry the password on a command line that every ps in the container sees.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Holds the live judge queue.
    oom_score_adj: -800
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Runs once per deploy and exits. Migrations used to run inside every service
  # on start: five containers taking turns on a lock, slow and noisy, and Flower
  # touching the database for no reason.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    command: python django_app/manage.py migrate --noinput
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    oom_score_adj: -500
    logging: *logging
    networks:
      - codegard_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    command: >
      gunicorn -k uvicorn.workers.UvicornWorker config.asgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:?GUNICORN_WORKERS is required}
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      # Unbuffered: Python holds piped output back otherwise, so a crash takes
      # the last (most interesting) lines with it.
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Losing it takes the whole site down.
    oom_score_adj: -500
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Runs once per deploy and exits: gathers the admin's CSS and JS into the
  # volume nginx serves. Without it the admin loads unstyled, since the request
  # falls through to the SPA and comes back as HTML.
  collectstatic:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    command: python django_app/manage.py collectstatic --noinput
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    volumes:
      - static_files:/app/django_app/staticfiles
    env_file: .env
    # Runs for seconds and exits anyway.
    oom_score_adj: 500
    logging: *logging
    networks:
      - codegard_net

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    # Celery defaults to one process per core, which on a small box quietly
    # competes with the judge for the same cores.
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:?CELERY_CONCURRENCY is required}
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # A killed task is redelivered on the next round.
    oom_score_adj: 100
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  judge-results-consumer:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    command: python django_app/manage.py consume_judge_results
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Verdicts wait in Redis until it is back.
    oom_score_adj: 0
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /tmp/consumer_heartbeat 2>/dev/null || echo 0) )) -lt 30"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    command: celery -A config beat -l info --pidfile=/tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Just an alarm clock; it catches up after a restart.
    oom_score_adj: 200
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  flower:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: web
    # No url_prefix: nginx no longer proxies Flower, and the prefix would 404
    # the tunnelled root. Basic auth stays as a second lock behind the tunnel.
    command: sh -c "celery -A config flower --port=5555 --basic_auth=$${FLOWER_USER}:$${FLOWER_PASSWORD}"
    environment:
      DJANGO_SETTINGS_MODULE: settings.prod
      PYTHONPATH: /app/django_app:/shared
      PYTHONUNBUFFERED: "1"
    env_file: .env
    # Bound to the server's own loopback, so the panel is reachable only from
    # the machine itself — that is, through an SSH tunnel, never from outside.
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    # First to go: nobody notices a missing dashboard.
    oom_score_adj: 500
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5555), timeout=2).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
      target: web
    # Each worker judges one submission at a time in a container of its own, and
    # every one of those takes a whole core. More workers means a faster queue
    # and a slower site, so this number is picked per machine, not guessed here.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8001
      --workers ${JUDGE_WORKERS:?JUDGE_WORKERS is required}
    # Named variables instead of the whole .env: this is the one service with a
    # line to the host's Docker socket, and it has no business holding the
    # database password, the Django key or the OAuth secrets. Redis is all it
    # ever talks to.
    environment:
      PYTHONPATH: /shared
      PYTHONUNBUFFERED: "1"
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    # Submissions keep piling up in the queue while it is gone.
    oom_score_adj: -100
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped
    # Asks /healthz rather than knocking on the port: the web server answers
    # the port even when the judging loop behind it has died, and a judge that
    # stopped judging would go on looking healthy while the queue piles up.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    build:
      context: ./frontend
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/static:ro
      # Certificates live on the server only — see infra/DEPLOY.md.
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      collectstatic:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    # The only door in.
    oom_score_adj: -400
    logging: *logging
    networks:
      - codegard_net
    restart: unless-stopped

networks:
  codegard_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_files:
